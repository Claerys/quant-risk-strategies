[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-risk-strategies"
version = "0.1.0"
description = "Market risk analytics for a systematic futures portfolio: VaR/ES, stress tests, risk limits."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.45",
    "plotly>=5.18",
]
ibkr = [
    "ibapi>=9.81.1.post1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_risk = ["*.csv", "ibkr/*.csv"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
